[project]
name = "flyrank-capstone-metering-billing"
version = "0.1.0"
description = "Usage Metering & Billing Engine (FlyRank capstone)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "celery[redis]>=5.6.3",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.52",
    "stripe>=15.6.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
